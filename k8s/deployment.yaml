apiVersion: apps/v1
kind: Deployment
metadata: { name: imposter, labels: { app: imposter } }
spec:
  replicas: 2
  selector: { matchLabels: { app: imposter } }
  template:
    metadata: { labels: { app: imposter } }
    spec:
      containers:
        - name: web
          image: DOCKERHUB_USER/imposter:latest
          ports: [{ containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: imposter-config } }, { secretRef: { name: imposter-secret } }]
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
          livenessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 15, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 10 }
